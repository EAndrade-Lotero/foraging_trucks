{% macro avatar_picker(config) %}
<style>
    .avatar-maker { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 1.5rem;
        align-items: start; margin: 1rem 0; }
    .avatar-stage { display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        background: #000; border: 2px solid #1a1a2e; border-radius: 10px; padding: 1.2rem 0.5rem 0.8rem; }
    .avatar-stage .avatar-caption { color: #ddd; font-size: 0.85rem; }
    .avatar-options h4 { font-size: 0.95rem; margin: 0.2rem 0 0.4rem; }
    .avatar-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.9rem; }
    .avatar-choice { border: 2px solid #d0d4da; background: #fff; border-radius: 10px; cursor: pointer;
        padding: 0.25rem 0.35rem 0.15rem; display: flex; flex-direction: column; align-items: center;
        font-size: 0.72rem; color: #444; min-width: 58px; }
    .avatar-choice:hover { border-color: #888; }
    .avatar-choice:focus-visible { outline: 3px solid #0d6efd; outline-offset: 1px; }
    .avatar-choice[aria-pressed="true"] { border-color: #0d6efd; box-shadow: 0 0 0 2px #0d6efd33; }
    .avatar-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff;
        box-shadow: 0 0 0 1px #aaa; margin: 2px; }
    .avatar-random { margin-top: 0.4rem; border: 2px solid #d0d4da; background: #fff; border-radius: 50%;
        cursor: pointer; width: 44px; height: 44px; padding: 0; display: flex; align-items: center;
        justify-content: center; color: #333; }
    .avatar-random:hover { border-color: #888; }
    .avatar-random:focus-visible { outline: 3px solid #0d6efd; outline-offset: 1px; }
    .avatar-random svg { width: 24px; height: 24px; }
    @media (max-width: 600px) { .avatar-maker { grid-template-columns: 1fr; } }
</style>
<div class="avatar-maker">
    <div class="avatar-stage">
        <div id="avatar-preview"></div>
        <div class="avatar-caption">This is you</div>
        <button type="button" class="avatar-random" id="avatar-random" aria-label="Random" title="Random">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 7h3.5c3 0 4.5 2 6 5s3 5 6 5H21"/><path d="M18 14l3 3-3 3"/>
                <path d="M3 17h3.5c1.4 0 2.5-.5 3.4-1.3"/><path d="M14.1 8.3C15 7.5 16.1 7 17.5 7H21"/>
                <path d="M18 4l3 3-3 3"/>
            </svg>
        </button>
    </div>
    <div class="avatar-options">
        <h4>Colour</h4><div class="avatar-row" id="avatar-color" role="group" aria-label="Colour"></div>
        <h4>Hat</h4><div class="avatar-row" id="avatar-hat" role="group" aria-label="Hat"></div>
        <h4>Eyes</h4><div class="avatar-row" id="avatar-eyes" role="group" aria-label="Eyes"></div>
    </div>
</div>
<script src="/static/pacman_avatar.js"></script>
<script>
(function () {
    var choice = PacAvatar.clean({{ (config.initial or {}) | tojson }});
    window.avatarChoice = choice;

    function render() {
        document.getElementById("avatar-preview").innerHTML = PacAvatar.svg(choice, { size: 120 });
        ["color", "hat", "eyes"].forEach(function (part) {
            document.querySelectorAll("#avatar-" + part + " .avatar-choice").forEach(function (b) {
                b.setAttribute("aria-pressed", b.dataset.value === choice[part] ? "true" : "false");
                // Hats and eyes are shown on your pac-man as it is now.
                var mini = b.querySelector(".avatar-mini");
                if (mini) {
                    var look = { body: choice.body, color: choice.color, hat: choice.hat, eyes: choice.eyes };
                    look[part] = b.dataset.value;
                    mini.innerHTML = PacAvatar.svg(look, { size: 36 });
                }
            });
        });
    }

    function button(part, value, inner, label) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "avatar-choice";
        b.dataset.value = value;
        b.setAttribute("aria-label", label);
        b.innerHTML = inner + (part === "color" ? "" : "<span>" + label + "</span>");
        b.addEventListener("click", function () { choice[part] = value; render(); });
        document.getElementById("avatar-" + part).appendChild(b);
    }

    Object.keys(PacAvatar.COLORS).forEach(function (c) {
        button("color", c, '<span class="avatar-swatch" style="background:' + PacAvatar.COLORS[c] + '"></span>',
               PacAvatar.LABELS[c]);
    });
    PacAvatar.HATS.forEach(function (h) {
        button("hat", h, '<span class="avatar-mini"></span>', PacAvatar.LABELS[h]);
    });
    PacAvatar.EYES.forEach(function (e) {
        button("eyes", e, '<span class="avatar-mini"></span>', PacAvatar.LABELS[e]);
    });
    document.getElementById("avatar-random").addEventListener("click", function () {
        var r = PacAvatar.random();
        Object.keys(r).forEach(function (k) { choice[k] = r[k]; });
        render();
    });
    render();

    psynet.stageResponse = function () {
        psynet.response.staged.rawAnswer = { body: choice.body, color: choice.color, hat: choice.hat, eyes: choice.eyes };
    };
})();
</script>
{% endmacro %}
