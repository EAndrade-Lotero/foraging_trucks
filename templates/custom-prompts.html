{% macro foraging_board(config) %}
<style>
    #foraging-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        margin: 1rem 0;
    }

    #foraging-canvas {
        border: 2px solid #1a1a2e;
        border-radius: 6px;
        background: #0f0f1a;
        touch-action: none;
        display: block;
    }

    #foraging-hud {
        font-size: 0.95rem;
        color: #333;
        text-align: center;
        max-width: 520px;
    }

    #foraging-score {
        font-weight: 600;
        margin-bottom: 0.25rem;
    }

    #foraging-board-wrap {
        position: relative;
        display: inline-block;
    }

    #foraging-timer {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        min-width: 3.5rem;
        padding: 0.35rem 0.6rem;
        border-radius: 6px;
        background: rgba(15, 15, 26, 0.88);
        color: #f8f8f8;
        font-size: 1.1rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
        border: 1px solid #3d3d5c;
        pointer-events: none;
    }

    #foraging-timer.warning {
        color: #ff7675;
        border-color: #ff7675;
    }
</style>

<div id="foraging-container">
    <div id="foraging-hud">
        <div id="foraging-score">Coins collected: 0</div>
        <div>Use arrow keys or WASD to move your pacman. Collect gold coins on the {{ config.grid_size }}&times;{{ config.grid_size }} board with up to {{ config.max_players }} players.</div>
    </div>
    <div id="foraging-board-wrap">
        <div id="foraging-timer">{{ config.timer_seconds }}</div>
        <canvas id="foraging-canvas" width="500" height="500"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
    var ROOM_ID = {{ config.room_id | tojson }};
    var GLOBAL_CH = {{ config.channel | tojson }};
    var GRID_SIZE = {{ config.grid_size }};
    var MAX_PLAYERS = {{ config.max_players }};
    var MY_ID = String({{ config.participant_id }});
    var KNOWN_PLAYERS = {{ config.known_players | tojson }};
    var TIMER_SECONDS = {{ config.timer_seconds }};
    var TIMER_STORAGE_KEY = "foraging_round_" + ROOM_ID;
    var COUNTDOWN_SOUND_KEY = "foraging_countdown_played_" + ROOM_ID;
    var COUNTDOWN_AUDIO = {{ config.countdown_audio | tojson }};
    var COIN_COLLECT_AUDIO = {{ config.coin_collect_audio | tojson }};

    var stats = { coins_collected: 0, moves: 0, collected_coin_coordinates: [] };
    var gameSocket = null;
    var leftGame = false;
    var booted = false;
    var timerExpired = false;
    var timerRemaining = TIMER_SECONDS;
    var timerInterval = null;
    var roundStartedAt = null;
    var countdownSound = null;
    var countdownSoundPlayed = false;
    var coinCollectSound = null;
    var localState = {
        players: JSON.parse(JSON.stringify(KNOWN_PLAYERS)),
        coins: [],
    };
    var renderer, scene, camera, boardGroup, entityMeshes = {};
    var cellSize = 1;
    var boardOffset = (GRID_SIZE - 1) / 2;

    function gridToWorld(x, y) {
        return {
            x: (x - boardOffset) * cellSize,
            y: (boardOffset - y) * cellSize,
        };
    }

    function parseColor(color) {
        try {
            return new THREE.Color(color);
        } catch (e) {
            return new THREE.Color(0xf1c40f);
        }
    }

    function initThree() {
        if (booted) return;
        booted = true;

        var canvas = document.getElementById("foraging-canvas");
        if (!canvas || typeof THREE === "undefined") {
            return;
        }

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(500, 500);
        renderer.setClearColor(0x0f0f1a);

        scene = new THREE.Scene();
        var frustum = GRID_SIZE * cellSize * 0.62;
        camera = new THREE.OrthographicCamera(
            -frustum, frustum, frustum, -frustum, 0.1, 100
        );
        camera.position.set(0, 0, 10);
        camera.lookAt(0, 0, 0);

        boardGroup = new THREE.Group();
        scene.add(boardGroup);

        var floorGeo = new THREE.PlaneGeometry(
            GRID_SIZE * cellSize, GRID_SIZE * cellSize
        );
        var floorMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2e });
        var floor = new THREE.Mesh(floorGeo, floorMat);
        boardGroup.add(floor);

        var gridMat = new THREE.LineBasicMaterial({ color: 0x2d2d44 });
        var half = (GRID_SIZE * cellSize) / 2;
        for (var i = 0; i <= GRID_SIZE; i++) {
            var offset = -half + i * cellSize;
            var hVerts = new Float32Array([
                -half, offset, 0.01,
                half, offset, 0.01,
            ]);
            var hGeo = new THREE.BufferGeometry();
            hGeo.setAttribute("position", new THREE.BufferAttribute(hVerts, 3));
            boardGroup.add(new THREE.Line(hGeo, gridMat));

            var vVerts = new Float32Array([
                offset, -half, 0.01,
                offset, half, 0.01,
            ]);
            var vGeo = new THREE.BufferGeometry();
            vGeo.setAttribute("position", new THREE.BufferAttribute(vVerts, 3));
            boardGroup.add(new THREE.Line(vGeo, gridMat));
        }

        localState.players = JSON.parse(JSON.stringify(KNOWN_PLAYERS));
        syncMeshes();
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (renderer && scene && camera) {
            renderer.render(scene, camera);
        }
    }

    function makePacmanMesh(color, isSelf) {
        var group = new THREE.Group();
        var bodyMat = new THREE.MeshBasicMaterial({
            color: parseColor(color),
            side: THREE.DoubleSide,
        });
        var bodyGeo = new THREE.CircleGeometry(0.34, 32, 0.15 * Math.PI, 1.7 * Math.PI);
        group.add(new THREE.Mesh(bodyGeo, bodyMat));

        if (isSelf) {
            var ringGeo = new THREE.RingGeometry(0.36, 0.42, 32);
            var ringMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide,
            });
            group.add(new THREE.Mesh(ringGeo, ringMat));
        }
        return group;
    }

    function makeCoinMesh() {
        var geo = new THREE.CircleGeometry(0.16, 24);
        var mat = new THREE.MeshBasicMaterial({
            color: 0xffd700,
            side: THREE.DoubleSide,
        });
        return new THREE.Mesh(geo, mat);
    }

    function syncMeshes() {
        if (!boardGroup) return;

        Object.keys(entityMeshes).forEach(function (key) {
            boardGroup.remove(entityMeshes[key]);
        });
        entityMeshes = {};

        (localState.coins || []).forEach(function (coin, idx) {
            var pos = gridToWorld(coin.x, coin.y);
            var mesh = makeCoinMesh();
            mesh.position.set(pos.x, pos.y, 0.05);
            boardGroup.add(mesh);
            entityMeshes["coin_" + idx] = mesh;
        });

        Object.keys(localState.players || {}).forEach(function (pid) {
            var player = localState.players[pid];
            var pos = gridToWorld(player.x, player.y);
            var mesh = makePacmanMesh(player.color, pid === MY_ID);
            mesh.position.set(pos.x, pos.y, 0.1);
            boardGroup.add(mesh);
            entityMeshes["player_" + pid] = mesh;
        });
    }

    function updateScore() {
        var me = (localState.players || {})[MY_ID];
        var coins = me ? me.coins : 0;
        stats.coins_collected = coins;
        stats.collected_coin_coordinates = me && me.collected_coin_coordinates
            ? me.collected_coin_coordinates.slice()
            : [];
        var scoreEl = document.getElementById("foraging-score");
        if (scoreEl) {
            scoreEl.textContent = "Coins collected: " + coins;
        }
    }

    function snapshotPlayerCoins(players) {
        var snapshot = {};
        Object.keys(players || {}).forEach(function (pid) {
            snapshot[pid] = players[pid].coins || 0;
        });
        return snapshot;
    }

    function anyPlayerCollectedCoin(previousCoins, players) {
        return Object.keys(players || {}).some(function (pid) {
            var previous = previousCoins[pid] || 0;
            var current = players[pid].coins || 0;
            return current > previous;
        });
    }

    function playCoinCollectSound() {
        if (!coinCollectSound) {
            coinCollectSound = new Audio(COIN_COLLECT_AUDIO);
        }
        coinCollectSound.currentTime = 0;
        var playPromise = coinCollectSound.play();
        if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {});
        }
    }

    function sendMessage(payload) {
        if (!gameSocket || gameSocket.readyState !== WebSocket.OPEN) return;
        gameSocket.send(GLOBAL_CH + ":" + JSON.stringify(payload));
    }

    function leaveRoom() {
        if (leftGame) return;
        leftGame = true;
        sendMessage({
            type: "leave_room",
            room_id: ROOM_ID,
            sender: MY_ID,
        });
    }

    function connectSocket() {
        if (typeof ReconnectingWebSocket === "undefined") return;

        var wsScheme = location.protocol === "https:" ? "wss://" : "ws://";
        gameSocket = new ReconnectingWebSocket(
            wsScheme + location.host + "/chat?channel=" + GLOBAL_CH
            + "&worker_id=" + dallinger.identity.workerId
            + "&participant_id=" + MY_ID
        );

        gameSocket.onopen = function () {
            if (leftGame) return;
            sendMessage({
                type: "join_room",
                room_id: ROOM_ID,
                sender: MY_ID,
                grid_size: GRID_SIZE,
                max_players: MAX_PLAYERS,
            });
        };

        gameSocket.onmessage = function (event) {
            if (event.data.indexOf(GLOBAL_CH + ":") !== 0) return;
            var msg;
            try {
                msg = JSON.parse(event.data.slice(GLOBAL_CH.length + 1));
            } catch (e) { return; }

            if (String(msg.room_id) !== String(ROOM_ID)) return;

            if (msg.type === "state_update") {
                var previousCoins = snapshotPlayerCoins(localState.players);
                localState = msg.state || { players: {}, coins: [] };
                if (!localState.players) {
                    localState.players = {};
                }
                if (anyPlayerCollectedCoin(previousCoins, localState.players)) {
                    playCoinCollectSound();
                }
                syncMeshes();
                updateScore();
                syncTimerFromState(localState);
                if (
                    window.foragingControl
                    && typeof window.foragingControl.onStateUpdate === "function"
                ) {
                    window.foragingControl.onStateUpdate(localState);
                }
            }
        };
    }

    function persistRoundStart(timestamp) {
        try {
            sessionStorage.setItem(TIMER_STORAGE_KEY, String(timestamp));
        } catch (e) {}
    }

    function loadPersistedRoundStart() {
        try {
            var value = sessionStorage.getItem(TIMER_STORAGE_KEY);
            return value ? parseFloat(value) : null;
        } catch (e) {
            return null;
        }
    }

    function clearPersistedRoundStart() {
        try {
            sessionStorage.removeItem(TIMER_STORAGE_KEY);
            sessionStorage.removeItem(COUNTDOWN_SOUND_KEY);
        } catch (e) {}
    }

    function initCountdownSound() {
        countdownSound = new Audio(COUNTDOWN_AUDIO);
        try {
            countdownSoundPlayed = sessionStorage.getItem(COUNTDOWN_SOUND_KEY) === "1";
        } catch (e) {
            countdownSoundPlayed = false;
        }
    }

    function maybePlayCountdownSound() {
        if (countdownSoundPlayed || timerRemaining > 10 || timerExpired) {
            return;
        }
        countdownSoundPlayed = true;
        try {
            sessionStorage.setItem(COUNTDOWN_SOUND_KEY, "1");
        } catch (e) {}
        if (!countdownSound) {
            return;
        }
        countdownSound.currentTime = 0;
        var playPromise = countdownSound.play();
        if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {});
        }
    }

    function computeTimerRemaining(startedAt) {
        var duration = localState.timer_duration || TIMER_SECONDS;
        var elapsed = (Date.now() / 1000) - startedAt;
        return Math.max(0, Math.ceil(duration - elapsed));
    }

    function syncTimerFromState(state) {
        var startedAt = state && state.round_started_at;
        if (startedAt === null || startedAt === undefined) {
            startedAt = loadPersistedRoundStart();
        }
        if (startedAt === null || startedAt === undefined) {
            return;
        }

        roundStartedAt = startedAt;
        persistRoundStart(startedAt);
        if (state && state.timer_duration) {
            localState.timer_duration = state.timer_duration;
        }

        timerRemaining = computeTimerRemaining(roundStartedAt);
        updateTimerDisplay();
        if (timerRemaining <= 0) {
            finishRound();
            return;
        }
        startTimerInterval();
    }

    function formatTimer(seconds) {
        return String(Math.max(0, seconds));
    }

    function updateTimerDisplay() {
        var timerEl = document.getElementById("foraging-timer");
        if (!timerEl) return;
        timerEl.textContent = formatTimer(timerRemaining);
        timerEl.classList.toggle("warning", timerRemaining <= 10);
        maybePlayCountdownSound();
    }

    function finishRound() {
        if (
            window.foragingControl
            && typeof window.foragingControl.submitResponse === "function"
        ) {
            window.foragingControl.submitResponse();
        }
    }

    function startTimerInterval() {
        if (timerInterval !== null || timerExpired) return;
        timerInterval = setInterval(function () {
            if (roundStartedAt === null) {
                return;
            }
            timerRemaining = computeTimerRemaining(roundStartedAt);
            updateTimerDisplay();
            if (timerRemaining <= 0) {
                finishRound();
            }
        }, 250);
    }

    function startTimer() {
        var persistedStart = loadPersistedRoundStart();
        if (persistedStart !== null) {
            roundStartedAt = persistedStart;
            timerRemaining = computeTimerRemaining(roundStartedAt);
            updateTimerDisplay();
            if (timerRemaining <= 0) {
                finishRound();
                return;
            }
            startTimerInterval();
        }
    }

    function tryMove(dx, dy) {
        if (
            timerExpired
            || timerRemaining <= 0
            || (window.foragingGame && window.foragingGame.isRoundOver())
        ) {
            return;
        }
        stats.moves += 1;
        sendMessage({
            type: "move",
            room_id: ROOM_ID,
            sender: MY_ID,
            dx: dx,
            dy: dy,
        });
    }

    function bindControls() {
        document.addEventListener("keydown", function (e) {
            var key = e.key.toLowerCase();
            if (key === "arrowup" || key === "w") {
                tryMove(0, -1);
                e.preventDefault();
            } else if (key === "arrowdown" || key === "s") {
                tryMove(0, 1);
                e.preventDefault();
            } else if (key === "arrowleft" || key === "a") {
                tryMove(-1, 0);
                e.preventDefault();
            } else if (key === "arrowright" || key === "d") {
                tryMove(1, 0);
                e.preventDefault();
            }
        });
    }

    window.addEventListener("beforeunload", leaveRoom);

    window.foragingGame = {
        getStats: function () {
            return {
                coins_collected: stats.coins_collected,
                collected_coin_coordinates: stats.collected_coin_coordinates,
                moves: stats.moves,
                room_id: ROOM_ID,
            };
        },
        endRound: function () {
            if (timerExpired) {
                return;
            }
            timerExpired = true;
            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            clearPersistedRoundStart();
        },
        isRoundOver: function () {
            return timerExpired;
        },
    };

    function boot() {
        initCountdownSound();
        initThree();
        connectSocket();
        bindControls();
    }

    if (typeof psynet !== "undefined" && psynet.trial && psynet.trial.onEvent) {
        psynet.trial.onEvent("trialConstruct", boot);
        psynet.trial.onEvent("trialStart", startTimer);
        psynet.trial.onEvent("trialFinish", leaveRoom);
    } else if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
            boot();
            startTimer();
        });
    } else {
        boot();
        startTimer();
    }
})();
</script>
{% endmacro %}
